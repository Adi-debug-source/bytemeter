<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><title>Bytemeter: social preview</title>
<link rel="stylesheet" href="art.css">
<style>
.stage { width: 1280px; height: 640px; padding: 80px; display: grid; grid-template-columns: 1fr 400px; gap: 56px; align-items: center; }
.name { display: flex; align-items: center; gap: 18px; font: 500 40px/1 var(--display); letter-spacing: -0.02em; }
.name img { width: 68px; height: 68px; }
.claim { margin: 34px 0 22px; font: 400 52px/1.1 var(--display); letter-spacing: -0.025em;
  font-variation-settings: "SOFT" 50, "WONK" 0; }
.claim em { font-style: normal; color: var(--accent); }
.dim { color: var(--ink-2); font-size: 22px; }
.pills { display: flex; gap: 10px; margin-top: 28px; }
.pills span { border: 1px solid var(--hairline-2); border-radius: 999px; padding: 6px 16px; font-size: 18px;
  font-weight: 550; color: var(--ink-2); }
.card { background: var(--surface); border: 1px solid var(--hairline-2); border-radius: 14px; padding: 30px 32px 14px; }
.eyebrow { font-size: 15px; font-weight: 650; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
.figure { display: flex; align-items: baseline; gap: 12px; margin: 14px 0 22px; }
.figure b { font: 600 104px/0.86 var(--display); letter-spacing: -0.03em; font-variation-settings: "SOFT" 50, "WONK" 0; }
.figure i { font-style: normal; font-size: 26px; font-weight: 700; color: var(--accent); }
.rows div { display: flex; justify-content: space-between; align-items: baseline; padding: 13px 0;
  border-top: 1px solid var(--hairline); font-size: 19px; font-weight: 550; }
.rows b { font-size: 22px; font-weight: 650; }
.rows .ahead b { color: var(--accent); }
</style></head>
<body><div class="stage">
  <div>
    <div class="name"><img src="icon.png" alt="">Bytemeter</div>
    <div class="claim">Counts <em>every byte</em> your Mac sends and receives, and <em>never sends one</em> itself.</div>
    <div class="dim">A macOS menu bar app in Swift. Exact, open and private.</div>
    <div class="pills"><span>Menu bar</span><span>Dashboard</span><span>CSV export</span></div>
  </div>
  <div class="card">
    <div class="eyebrow">Today</div>
    <div class="figure"><b>3.21</b><i>GB</i></div>
    <div class="rows">
      <div><span>Last 7 days</span><b>21.0 GB</b></div>
      <div><span>Last 30 days</span><b>89.6 GB</b></div>
      <div class="ahead"><span>On track for</span><b>100.8 GB</b></div>
    </div>
  </div>
</div></body></html>
