name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: The embedded fonts match their files
        # DashboardFonts.swift is generated from Resources/Fonts and committed,
        # so the build never needs Python. This fails if the two disagree.
        run: python3 Scripts/make_fonts.py --check
      - name: Builds
        run: swift build -c release
      - name: Self-test
        run: swift run -c release BytemeterSelfTest
      - name: The demo database builds a dashboard that fetches nothing
        # The pipeline the README images come from, end to end: the synthetic
        # database, then --dashboard on it, then the promise that the page it
        # writes has no script and names no web address.
        run: |
          python3 Scripts/make_demo_db.py "$RUNNER_TEMP/demo" --now 2026-09-29T21:30
          .build/release/Bytemeter --dashboard "$RUNNER_TEMP/demo" --as-of 2026-09-29T21:30
          test -s "$RUNNER_TEMP/demo/dashboard.html"
          test -s "$RUNNER_TEMP/demo/bytemeter_export.csv"
          if grep -Eiq '<script|https?:' "$RUNNER_TEMP/demo/dashboard.html"; then exit 1; fi
      - name: Install script parses
        run: bash -n install.sh
      - name: Homebrew formula parses
        run: ruby -c Formula/bytemeter.rb
      - name: The app builds from a clean clone
        # The command a release and the Homebrew formula both build with, run
        # in a fresh clone of the commit under test, so no untracked file and
        # none of the build output from the steps above can help it. This
        # proves on every push that the repository alone can produce the app,
        # not only the binary.
        run: |
          git clone --quiet --no-checkout . "$RUNNER_TEMP/clone"
          git -C "$RUNNER_TEMP/clone" checkout --quiet "$(git rev-parse HEAD)"
          "$RUNNER_TEMP/clone/install.sh" --bundle-only "$RUNNER_TEMP/bundle"
      - name: The app is signed and well formed
        run: |
          app="$RUNNER_TEMP/bundle/Bytemeter.app"
          codesign --verify --deep --strict "$app"
          plutil -lint "$app/Contents/Info.plist" Scripts/Info.plist Scripts/bytemeter.plist
          test -f "$app/Contents/Resources/AppIcon.icns"
          # The fonts are in the binary, so their licences must be in the bundle.
          for doc in OFL-Fraunces.txt OFL-InterTight.txt README.md; do
            test -s "$app/Contents/Resources/Fonts/$doc"
          done
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = "$(sed -n 's/^VERSION=//p' VERSION)"
